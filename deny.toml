# cargo-deny configuration — run with `cargo deny check`.
# https://embarkstudios.github.io/cargo-deny/

[licenses]
# soroban-sdk's dependency tree (curve25519-dalek, ark-*, digest, etc.) is
# permissively licensed. Anything outside this list needs a deliberate
# addition here, not a silent pass.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
